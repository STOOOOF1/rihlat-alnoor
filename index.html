<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<title>رحلة النور — أركان الإسلام والإيمان</title>
<link rel="stylesheet" href="dist/game.css">
<style>
  html,body{margin:0;height:100%;background:#071226;overflow:hidden}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at 50% 35%,#16386e 0%,#071226 70%);color:#f6e7b8;
        font-family:"Segoe UI",Tahoma,sans-serif;z-index:100;transition:opacity .8s}
  #boot h1{font-size:clamp(28px,6vw,56px);margin:0 0 8px;letter-spacing:1px}
  #boot p{opacity:.8;margin:0 0 26px;font-size:clamp(14px,2.4vw,20px)}
  #boot .bar{width:min(420px,70vw);height:10px;border-radius:10px;background:#ffffff22;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#e9b949,#fff3c4);border-radius:10px;transition:width .3s}
  #boot small{margin-top:14px;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="boot">
  <h1>رحلة النور</h1>
  <p>أركان الإسلام وأركان الإيمان</p>
  <div class="bar"><i id="bootbar"></i></div>
  <small id="boottxt">جارٍ بناء العالم…</small>
</div>
<script src="dist/game.js"></script>
</body>
</html>
